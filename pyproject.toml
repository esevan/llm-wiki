[project]
name = "llm-wiki"
version = "0.1.0"
description = "Performance-first local Markdown knowledge workbench"
requires-python = ">=3.12"
dependencies = ["aiosqlite>=0.20", "fastapi>=0.115", "httpx>=0.27", "uvicorn[standard]>=0.30", "platformdirs>=4.2", "watchfiles>=0.24", "keyring>=25.0"]

[project.optional-dependencies]
semantic = ["fastembed>=0.4", "onnxruntime==1.22.1; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
ai = ["langgraph>=0.4"]

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["llm_wiki/**/*.py", "llm_wiki/prompts/*.md", "llm_wiki/static/*.html", "llm_wiki/static/i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Ruff's formatter cannot safely split long string literals, including prompts,
# SQL, and embedded browser assertions. All other Python is formatted to 120.
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "playwright>=1.50",
    "ruff>=0.16.5",
]
