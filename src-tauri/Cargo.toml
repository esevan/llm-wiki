[package]
name = "llm-wiki-desktop"
version = "0.1.0"
description = "Local-first LLM Wiki desktop shell"
edition = "2021"

[lib]
name = "llm_wiki_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
dirs = "6"
futures-util = "0.3"
fastembed = { version = "6.0.2", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
